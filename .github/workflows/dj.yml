name: Build DJ Pads

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project
        run: |
          mkdir app && cd app
          echo '' | base64 -d | tar xz
          find . -type f | sort

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Generate sounds (WAV -> MP3)
        working-directory: app
        run: |
          python3 tools/gen_sounds.py
          sh tools/make_mp3.sh
          ls src/common/sounds | wc -l

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build .rpk
        working-directory: app
        run: npm run build

      - name: List build output
        working-directory: app
        run: ls -laR dist

      - name: Upload .rpk
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Pads-rpk
          path: app/dist/*.rpk
          if-no-files-found: error
